<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESS Safety Leadership Walk Scenario Generator</title><style>
:root{--navy:#17365d;--teal:#00a6a6;--pale:#f3f6f8;--ink:#17212b}*{box-sizing:border-box}body{margin:0;background:var(--pale);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}header{background:var(--navy);color:#fff;padding:24px 6vw;border-bottom:6px solid var(--teal)}header h1{margin:0;font-size:clamp(1.4rem,3vw,2.2rem)}header p{margin:6px 0 0;opacity:.92}main{max-width:900px;margin:34px auto;padding:0 18px}.card{background:#fff;border-radius:15px;padding:28px;box-shadow:0 8px 26px #17365d20;border-top:6px solid var(--teal)}.category{display:inline-block;background:#e6f7f7;color:#075d5d;border-radius:999px;padding:7px 11px;font-weight:700}.id{float:right;color:#66727e;font-size:.92rem}h2{color:var(--navy);font-size:1.05rem;margin:24px 0 7px}p{line-height:1.58}button{background:var(--teal);color:#063939;border:0;border-radius:9px;padding:14px 20px;margin-top:22px;font-size:1rem;font-weight:700;cursor:pointer}button:hover{filter:brightness(.95)}.start{text-align:center;color:#66727e;padding:30px 10px}.note{font-size:.82rem;color:#6b7785;margin-top:14px}</style></head><body><header><h1>ESS | Safety Leadership Walk</h1><p>Random scenario generator</p></header><main><section class="card"><div id="scenario" class="start">Select the button to generate a Safety Leadership Walk scenario.</div><button id="go">Generate random scenario</button><div class="note">Contains 40 anonymised scenarios. A scenario will not repeat until all 40 have been displayed.</div></section></main><script>
const scenarios=[{"Scenario ID": "SLW-001", "Category": "Equipment", "What happened?": "A cleaner became trapped inside a windowless en-suite for over an hour after the door handle fell off. The cleaner was bruised while trying to attract attention and obtain help.", "Key learning": "Staff working alone must have a reliable means of raising the alarm, and doors and escape arrangements should be checked and maintained.", "Manager observation prompt": "If someone became trapped or injured in this area, how would they summon help, and how quickly would we know?"}, {"Scenario ID": "SLW-002", "Category": "Equipment", "What happened?": "A toaster produced black smoke, but the fire alarm did not activate.", "Key learning": "A minor equipment fault can become more serious when fire-detection arrangements do not operate as expected.", "Manager observation prompt": "When were the alarms in this area last tested, and does everyone know how to report and escalate an alarm fault?"}, {"Scenario ID": "SLW-003", "Category": "Slips, trips & falls", "What happened?": "A supervisor fell down three office steps. The stair light had reportedly been out for the previous week.", "Key learning": "Reported defects require timely action, with temporary controls introduced while permanent repairs are outstanding.", "Manager observation prompt": "What defects are currently awaiting repair, who owns them, and what interim controls are in place?"}, {"Scenario ID": "SLW-004", "Category": "Food safety", "What happened?": "A chef was distracted while heating oil on an induction hob. The oil subsequently caught fire during breakfast preparation.", "Key learning": "Heating oil must remain under close supervision, particularly during busy services when interruptions and distractions are likely.", "Manager observation prompt": "How do we prevent chefs from being distracted or called away while oil and other high-risk items are heating?"}, {"Scenario ID": "SLW-005", "Category": "PPE", "What happened?": "A cleaner received chemical splashes while cleaning a dishwasher without gloves or eye protection.", "Key learning": "The correct PPE must be readily available, suitable for the chemical being used and consistently worn.", "Manager observation prompt": "Can the team show me the required PPE and explain when it must be used for this task?"}, {"Scenario ID": "SLW-006", "Category": "Maintenance", "What happened?": "A metal ceiling bar fell from a height of over three metres and could have struck someone working below.", "Key learning": "Loose overhead fixtures require immediate isolation of the affected area until they have been inspected and made safe.", "Manager observation prompt": "Are there any loose, damaged or unsecured fixtures above work areas, and would staff know to stop work and cordon off the area?"}, {"Scenario ID": "SLW-007", "Category": "Storage", "What happened?": "During a delivery, heavy boxes had shifted and crushed lighter boxes. Part of the load was leaning against the container door.", "Key learning": "A shifted load can fall onto the person opening the vehicle or container, so its stability should be assessed before unloading begins.", "Manager observation prompt": "How do we check for a shifted or unstable load before opening a delivery vehicle or container?"}, {"Scenario ID": "SLW-008", "Category": "Food safety", "What happened?": "Chicken skewers were served inside wraps without customers being alerted to their presence.", "Key learning": "Preparation and service checks must identify concealed items that could injure customers.", "Manager observation prompt": "What final check confirms that skewers, cocktail sticks or other preparation items have been removed or clearly communicated before service?"}, {"Scenario ID": "SLW-009", "Category": "Other", "What happened?": "A cleaner was bitten by a dog while cleaning an office.", "Key learning": "Animals can present a foreseeable risk, and cleaners should be warned before entering areas where animals may be present.", "Manager observation prompt": "How are staff informed about animals on site, and should the animal be secured before cleaning begins?"}, {"Scenario ID": "SLW-010", "Category": "Other", "What happened?": "A colleague briefed teammates about their epilepsy. When the colleague later experienced seizures, the team responded calmly.", "Key learning": "Appropriate emergency information and clear response arrangements can help colleagues provide effective assistance.", "Manager observation prompt": "Do team members understand the emergency arrangements for this workplace, including how to summon first-aid or medical assistance?"}, {"Scenario ID": "SLW-011", "Category": "Equipment", "What happened?": "Dishes repeatedly fell through gaps in a servery because the plates did not fit the equipment correctly.", "Key learning": "Equipment and serving arrangements must be suitable for the items being used. Repeated near misses should not become accepted as normal.", "Manager observation prompt": "What equipment or setup does the team currently work around rather than reporting or correcting?"}, {"Scenario ID": "SLW-012", "Category": "Manual handling", "What happened?": "A cleaner continued working for several days after suffering a back strain. The injury was reported later and became an over-seven-day RIDDOR incident.", "Key learning": "Pain and injuries should be reported promptly so that treatment, investigation and suitable work restrictions can be considered.", "Manager observation prompt": "Does everyone know when and how to report discomfort, even when it initially appears minor?"}, {"Scenario ID": "SLW-013", "Category": "Housekeeping", "What happened?": "A cleaner struck their head on a shelf while standing up from the floor.", "Key learning": "Low-level cleaning can expose employees to shelving and other head-height obstructions that may not be obvious when starting the task.", "Manager observation prompt": "Before cleaning at floor level, do we check the space above and around the person for shelves, corners and other obstructions?"}, {"Scenario ID": "SLW-014", "Category": "Manual handling", "What happened?": "A delivery trolley swerved while being moved on a sloped road, resulting in an employee straining their ribs.", "Key learning": "The route, gradient, trolley condition and size of the load must be considered before materials are moved.", "Manager observation prompt": "Is this trolley suitable for the route and load, and what would happen if it began moving or changing direction unexpectedly?"}, {"Scenario ID": "SLW-015", "Category": "Housekeeping", "What happened?": "A cleaner struck their head on the corner of an electrical box while cleaning behind a pump.", "Key learning": "Confined areas can contain sharp corners and restricted movement. The workspace should be assessed before reaching or bending into it.", "Manager observation prompt": "Can this area be cleaned without placing someone’s head or body close to sharp edges or fixed equipment?"}, {"Scenario ID": "SLW-016", "Category": "PPE", "What happened?": "An employee was scalded when a mop bucket overturned while they were rushing near a boiler. The incident later became RIDDOR-reportable.", "Key learning": "Hot water, unstable containers and rushing are a dangerous combination. Cleaning routines must allow the task to be completed safely.", "Manager observation prompt": "What causes people to rush this task, and can we use safer water temperatures, equipment or working arrangements?"}, {"Scenario ID": "SLW-017", "Category": "Equipment", "What happened?": "An agency cleaner reported receiving an electric shock associated with a vacuum cable.", "Key learning": "Electrical equipment involved in a suspected shock should be taken out of use and investigated rather than returned immediately to service.", "Manager observation prompt": "Does everyone, including agency staff, know how to isolate, label and report electrical equipment following a shock or suspected fault?"}, {"Scenario ID": "SLW-018", "Category": "Maintenance", "What happened?": "Defective kitchen flooring contributed to repeated slip and trip near misses. A temporary repair had failed, and problems recurred near a water boiler.", "Key learning": "Repeated temporary repairs may not provide an adequate long-term control, especially in areas regularly exposed to water.", "Manager observation prompt": "Are we repeatedly applying temporary fixes where a permanent repair or replacement is now required?"}, {"Scenario ID": "SLW-019", "Category": "Storage", "What happened?": "Knives, razor blades and broken glass were found in waste or mixed in with utensils, resulting in near misses and cuts.", "Key learning": "Sharp objects must be stored and disposed of through a controlled system. Staff should never reach blindly into waste or containers.", "Manager observation prompt": "Where should knives, blades and broken glass be placed, and could everyone here explain the correct process?"}, {"Scenario ID": "SLW-020", "Category": "Equipment", "What happened?": "A postmix machine produced a burning smell. The employee switched off the machine and gas supply, evacuated the area and contacted the onsite fire response.", "Key learning": "Early recognition, safe isolation and prompt escalation can prevent an equipment fault from developing into a more serious fire.", "Manager observation prompt": "If this equipment began smoking or produced a burning smell, would staff know what they could safely isolate and when to evacuate?"}, {"Scenario ID": "SLW-021", "Category": "Fire", "What happened?": "Mobile Shredder onsite shredding confidential paper. Contractor processing a load of paper through the vehicle and noticed smoke. Vehicle exited and emergency services attended. No one was injured. No visual flames noticed just smoke. FIre services distinguished and advised that vehicle was OK to drive just leave it for at least 30 minutes. Driver left over an hour later", "Key learning": "Stop work, raise the alarm and isolate the area or equipment. Treat smoke, burning smells and overheating as warning signs requiring immediate escalation.", "Manager observation prompt": "Check that fire routes are clear, equipment checks are current, and staff can explain who to contact and what to isolate if they detect smoke or a burning smell."}, {"Scenario ID": "SLW-022", "Category": "Fire", "What happened?": "While walking the accommodation block to check the cleaning with another colleague we entered the ablution area where there was a strong smell of burning, I went straight up the QM building and reported it to the WO2 we then joined by the GM and went to the building for them to see for themselves, WO he would report it to the maintenance manager and said he thinks as the area has has a full refurb its probably the wires smelling as they are new.", "Key learning": "Stop work, raise the alarm and isolate the area or equipment. Treat smoke, burning smells and overheating as warning signs requiring immediate escalation.", "Manager observation prompt": "Check that fire routes are clear, equipment checks are current, and staff can explain who to contact and what to isolate if they detect smoke or a burning smell."}, {"Scenario ID": "SLW-023", "Category": "Contact with Moving Machinery (or Material Being Machined)", "What happened?": "Whilst in the Hospitality area, I entered the lift to travel down to the kitchen. The lift became stuck between floors, and I remained inside for approximately 30 minutes before being safely rescued by the on-site team. No injuries were sustained or reported as a result of the incident. Other than a bruised sense of pride.", "Key learning": "Defective or trapped equipment must be taken out of use and reported. Staff should know the safe shutdown and emergency rescue arrangements.", "Manager observation prompt": "Confirm equipment inspections are current, defects are labelled and isolated, and staff know the emergency procedure without attempting an unsafe rescue."}, {"Scenario ID": "SLW-024", "Category": "Cut", "What happened?": "As the cleaner was about to empty the general waste bin in the kitchen, he noticed there was a large amount of broken glass present in the bin. This is a potential hazard as the cleaner could have received a cut whilst taking the bin out.", "Key learning": "Do not reach blindly into waste, sinks or cluttered areas. Isolate broken or sharp items and use the correct disposal method and protective equipment.", "Manager observation prompt": "Look for exposed blades, broken crockery, protruding nails and unsafe disposal practices. Ask staff how they would make the hazard safe before cleaning continues."}, {"Scenario ID": "SLW-025", "Category": "Contact with Chemicals or Harmful Substances", "What happened?": "The IP was cleaning the ladies toilet. He got carried away with the toilet brush cleaning the WC, and managed to splash diluted toilet cleaner and water into his right eye. He called his Supervisor who told him to flush / rinse his eye out with cold water until she get to him. The Supervisor contacted our ESS first aider & both went to see IP. Then took IP to cleaners office area, where they continued to witness IP rinse his Right eye. After 15 mins he stated he was better & wanted to return to work. Supervisor advised him to take his lunch break & go get some fresh air & and come back after lunch so she could check he was ok. He came back after lunch & his eye looked much better, so he returned back to work.", "Key learning": "Chemicals must be correctly labelled, stored and used to the COSHH assessment. Never mix products or leave cleaning chemicals where they can be mistaken for consumables.", "Manager observation prompt": "Check labels, dilution controls, storage and COSHH information. Ask a team member to explain the safe process for the chemical they are using."}, {"Scenario ID": "SLW-026", "Category": "Hit by a Moving, Flying or Falling Object", "What happened?": "At approximately 1530 this afternoon (Friday) I was alerted by Simon Haugh that we had another hole in the dining room ceiling. It is understood from CGA that an operative put his foot through the lathe and plaster although it was not clear if the individual should have been in the area . The operator had not reported the incident at the time as Simon found the damage when conducting his duties in the mess. Fortunately only a small amount of plaster came down as a direct result of the incident and with no reported injuries however it left plaster dangling in an unsafe state and the dining room exposed to the dust, insulation material and debris in the attic space above.", "Key learning": "Keep walking routes clear and dry, deal with defects promptly, and use suitable access equipment rather than improvising.", "Manager observation prompt": "Inspect floors, thresholds, stairs and access routes. Ask what controls are used when a spill, obstruction or damaged surface is found."}, {"Scenario ID": "SLW-027", "Category": "Hit by a Moving, Flying or Falling Object", "What happened?": "The shutter had automatically closed due to F&G action in the accommodation. Shelly was cleaning tables and needed to rinse her cloth. the hose is positioned in the potwash area and Shelly reached in through the hatch to rinse her cloth. The hatch is normally open and personnel hand there dirty cutlery and crockery in, during every meal time.", "Key learning": "Keep walking routes clear and dry, deal with defects promptly, and use suitable access equipment rather than improvising.", "Manager observation prompt": "Inspect floors, thresholds, stairs and access routes. Ask what controls are used when a spill, obstruction or damaged surface is found."}, {"Scenario ID": "SLW-028", "Category": "Hit Fixed or Stationary Object", "What happened?": "Reversing in the premier inn car park and caught the side of the van on the railings and the bolt of the railings pulled the side panel of the van and scratched the side of the van", "Key learning": "Keep hands clear of closing and trapping points, and report defective doors, restrictors or fittings before they cause injury.", "Manager observation prompt": "Check doors, windows and fittings for pinch points or damage. Ask staff what they would do if a restrictor, closer or guard was defective."}, {"Scenario ID": "SLW-029", "Category": "Hit by a Moving, Flying or Falling Object", "What happened?": "The employee was doing her normal cleaning duty in Raper building and a speaker which was held up by 2 screws came away from the wall. The speaker just slightly caught her on the left breast.", "Key learning": "Keep walking routes clear and dry, deal with defects promptly, and use suitable access equipment rather than improvising.", "Manager observation prompt": "Inspect floors, thresholds, stairs and access routes. Ask what controls are used when a spill, obstruction or damaged surface is found."}, {"Scenario ID": "SLW-030", "Category": "Hit by a Moving, Flying or Falling Object", "What happened?": "tile fell from male shower locker rooom ceiling in building CHF HQ 655 just missing cleaner", "Key learning": "Keep walking routes clear and dry, deal with defects promptly, and use suitable access equipment rather than improvising.", "Manager observation prompt": "Inspect floors, thresholds, stairs and access routes. Ask what controls are used when a spill, obstruction or damaged surface is found."}, {"Scenario ID": "SLW-031", "Category": "Hit by a Moving, Flying or Falling Object", "What happened?": "While opening both the front doors to the store part of the frame came off almost hitting a member of staff on the head", "Key learning": "Keep walking routes clear and dry, deal with defects promptly, and use suitable access equipment rather than improvising.", "Manager observation prompt": "Inspect floors, thresholds, stairs and access routes. Ask what controls are used when a spill, obstruction or damaged surface is found."}, {"Scenario ID": "SLW-032", "Category": "Slip, Trip or Fall", "What happened?": "Maria was standing on a padded chair to reach the top shelf of shelving to clean it. resuiting in her falling off the chair and landing on the floor with her right arm out trying to save herself.", "Key learning": "Keep walking routes clear and dry, deal with defects promptly, and use suitable access equipment rather than improvising.", "Manager observation prompt": "Inspect floors, thresholds, stairs and access routes. Ask what controls are used when a spill, obstruction or damaged surface is found."}, {"Scenario ID": "SLW-033", "Category": "Trapped by Something Collapsing", "What happened?": "divider wall between plate wash and seating area was reported to Vivo. Vivo/MMS attended the job 30th Sept, and suggested this could be a structural issue and have escalated to a structural engineer and we await their visit. No dates have been confirmed for this as yet", "Key learning": "Pause the task, identify what changed or failed, and make the area safe before work resumes. Report defects and near misses promptly so controls can be improved.", "Manager observation prompt": "Ask the team to identify the hazard, the immediate control and the person responsible for follow-up. Confirm the action has been recorded and closed out."}, {"Scenario ID": "SLW-034", "Category": "Slip, Trip or Fall", "What happened?": "Team member was walking from their car to the Officers Mess to cover hall porter duties using the staff entrance. The team member lost footing and tripped over while walking through the loading bay, the surface is uneven with lots of dips and cracks.", "Key learning": "Keep walking routes clear and dry, deal with defects promptly, and use suitable access equipment rather than improvising.", "Manager observation prompt": "Inspect floors, thresholds, stairs and access routes. Ask what controls are used when a spill, obstruction or damaged surface is found."}, {"Scenario ID": "SLW-035", "Category": "Slip, Trip or Fall", "What happened?": "Individual was walking through carpark at end of shift when they lost their footing and stumbled. the fell down and dropped contents of bag. No injury sustained.", "Key learning": "Keep walking routes clear and dry, deal with defects promptly, and use suitable access equipment rather than improvising.", "Manager observation prompt": "Inspect floors, thresholds, stairs and access routes. Ask what controls are used when a spill, obstruction or damaged surface is found."}, {"Scenario ID": "SLW-036", "Category": "Slip, Trip or Fall", "What happened?": "No street lighting at Horsea Island, it is very dark for the staff at 0600 to walk from the guard room to their place of work, also leaves are covering pavements", "Key learning": "Keep walking routes clear and dry, deal with defects promptly, and use suitable access equipment rather than improvising.", "Manager observation prompt": "Inspect floors, thresholds, stairs and access routes. Ask what controls are used when a spill, obstruction or damaged surface is found."}, {"Scenario ID": "SLW-037", "Category": "Slip, Trip or Fall", "What happened?": "On 22 October 2026, the Brakes delivery arrived later than scheduled. As a result, deliveries needed to be transferred from the ration store to the back kitchen during hours of darkness and in wet weather conditions. Olena, a Chef, assisted by members of the Front of House team, was moving cages across the car park. While pushing a cage towards the back kitchen, Olena was unable to see an indentation in the road surface due to the poor visibility and adverse weather conditions. When the cage passed over the uneven surface, it became unstable and tipped over Fortunately, the chef was not injured, and no other persons were involved. However, the incident had the potential to cause injury to Chef or others in the vicinity, particularly due to the weight of the cage and the risk of slips, trips, or impact injuries.", "Key learning": "Keep walking routes clear and dry, deal with defects promptly, and use suitable access equipment rather than improvising.", "Manager observation prompt": "Inspect floors, thresholds, stairs and access routes. Ask what controls are used when a spill, obstruction or damaged surface is found."}, {"Scenario ID": "SLW-038", "Category": "Ill Health / Medical Reason", "What happened?": "Jo was standing in the pot wash area when she became light headed and fainted. we put her in the staff room with a glass of water and called 111 for advice. she was well with instruction's to visit the doctor.", "Key learning": "Pause the task, identify what changed or failed, and make the area safe before work resumes. Report defects and near misses promptly so controls can be improved.", "Manager observation prompt": "Ask the team to identify the hazard, the immediate control and the person responsible for follow-up. Confirm the action has been recorded and closed out."}, {"Scenario ID": "SLW-039", "Category": "Contact with Hot or Cold Surface, Liquid or Environment", "What happened?": "Team member was preparing a cup of coffee for a customer, the cup slipped through their hand while they were moving it away from the hot water boiler causing it to spill onto their hand.", "Key learning": "Pause the task, identify what changed or failed, and make the area safe before work resumes. Report defects and near misses promptly so controls can be improved.", "Manager observation prompt": "Ask the team to identify the hazard, the immediate control and the person responsible for follow-up. Confirm the action has been recorded and closed out."}, {"Scenario ID": "SLW-040", "Category": "Contact with Hot or Cold Surface, Liquid or Environment", "What happened?": "Delcy was removing a tray from the hot box, advised me that the tray was stuck, whilst trying to remove it her arm got touched the side of the box which caused a burn on her left arm. First aid was applied by head chef, burn gel was used.", "Key learning": "Defective or trapped equipment must be taken out of use and reported. Staff should know the safe shutdown and emergency rescue arrangements.", "Manager observation prompt": "Confirm equipment inspections are current, defects are labelled and isolated, and staff know the emergency procedure without attempting an unsafe rescue."}];let deck=[];const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function refill(){deck=[...scenarios];for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}
function next(){if(!deck.length)refill();const s=deck.pop();const box=document.getElementById('scenario');box.className='';box.innerHTML=`<span class="category">${esc(s['Category'])}</span><span class="id">${esc(s['Scenario ID'])}</span><h2>What happened?</h2><p>${esc(s['What happened?'])}</p><h2>Key learning</h2><p>${esc(s['Key learning'])}</p><h2>Manager observation prompt</h2><p>${esc(s['Manager observation prompt'])}</p>`;}
document.getElementById('go').addEventListener('click',next);
</script></body></html>
